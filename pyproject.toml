[build-system]
requires = ["setuptools>=75.6.0,<76", "wheel>=0.45.1,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-saude-ambiental"
version = "0.1.0"
description = "Estudo reproduzivel de saude ambiental e epidemiologia em Volta Redonda"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "PyYAML==6.0.2",
  "duckdb==1.1.3",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.6",
  "openpyxl==3.1.5",
]

[project.scripts]
vr-saude = "vr_saude.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
